name: Build WhatsApp Date Spoof

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install dpkg

      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git SDKs

          SDK=$(find SDKs -type d -name 'iPhoneOS12*.sdk' | sort -V | tail -1)

          if [ -z "$SDK" ]; then
            echo "No iOS 12 SDK found"
            exit 1
          fi

          echo "Using SDK: $SDK"
          echo "SDK=$PWD/$SDK" >> "$GITHUB_ENV"

      - name: Download fishhook
        run: |
          git clone --depth 1 https://github.com/facebook/fishhook.git fishhook

          test -f fishhook/fishhook.c
          test -f fishhook/fishhook.h

      - name: Replace tweak with fishhook implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          tweak = Path("Tweak.m").read_text()
          fishhook = Path("fishhook/fishhook.c").read_text()

          # Keep the tweak source separate from fishhook's implementation.
          Path("fishhook_build.c").write_text(fishhook)
          PY

      - name: Build tweak
        run: |
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc \
            -I"$PWD/fishhook" \
            -dynamiclib \
            -framework Foundation \
            -o WhatsAppDateSpoof.dylib \
            Tweak.m \
            fishhook_build.c

      - name: Create Debian package
        run: |
          mkdir -p package/Library/MobileSubstrate/DynamicLibraries
          mkdir -p package/DEBIAN

          cp WhatsAppDateSpoof.dylib \
            package/Library/MobileSubstrate/DynamicLibraries/

          cp WhatsAppDateSpoof.plist \
            package/Library/MobileSubstrate/DynamicLibraries/

          cp control package/DEBIAN/control

          mkdir -p packages

          dpkg-deb --build \
            package \
            packages/com.coalblox.whatsappdatespoof_1.0.0_iphoneos-arm.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppDateSpoof
          path: packages/*.deb
