name: Build WhatsApp Date Spoof

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM tools
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git SDKs
          SDK=$(find SDKs -maxdepth 2 -type d -name 'iPhoneOS*.sdk' | sort -V | tail -1)
          echo "SDK=$SDK" >> "$GITHUB_ENV"

      - name: Build dylib
        run: |
          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc \
            -dynamiclib \
            -framework Foundation \
            -o WhatsAppDateSpoof.dylib \
            Tweak.m

      - name: Create package
        run: |
          mkdir -p package/Library/MobileSubstrate/DynamicLibraries
          cp WhatsAppDateSpoof.dylib package/Library/MobileSubstrate/DynamicLibraries/
          cp WhatsAppDateSpoof.plist package/Library/MobileSubstrate/DynamicLibraries/

          mkdir -p package/DEBIAN
          cp control package/DEBIAN/control

          mkdir -p packages
          dpkg-deb --build package packages/com.coalblox.whatsappdatespoof_1.0.0_iphoneos-arm.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppDateSpoof
          path: packages/*.deb
