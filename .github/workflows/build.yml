name: Build WhatsApp Date Spoof

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install dpkg

      - name: Get iOS SDK
        run: |
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git SDKs

          SDK=$(find SDKs -type d -name 'iPhoneOS*.sdk' | sort -V | grep 'iPhoneOS12' | tail -1)

          if [ -z "$SDK" ]; then
            echo "::error::No iOS 12 SDK found"
            find SDKs -type d -name '*.sdk' | head -50
            exit 1
          fi

          echo "Using SDK: $SDK"
          echo "SDK=$PWD/$SDK" >> "$GITHUB_ENV"

      - name: Get fishhook
        run: |
          git clone --depth 1 https://github.com/facebook/fishhook.git fishhook
          test -f fishhook/fishhook.c
          test -f fishhook/fishhook.h

      - name: Build dylib
        run: |
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc \
            -I"$PWD/fishhook" \
            -dynamiclib \
            -framework Foundation \
            -o WhatsAppDateSpoof.dylib \
            Tweak.m \
            fishhook/fishhook.c

          echo "Checking dylib:"
          file WhatsAppDateSpoof.dylib
          ls -lh WhatsAppDateSpoof.dylib

      - name: Create Debian package
        run: |
          rm -rf package packages

          mkdir -p \
            package/Library/MobileSubstrate/DynamicLibraries \
            package/DEBIAN \
            packages

          cp WhatsAppDateSpoof.dylib \
            package/Library/MobileSubstrate/DynamicLibraries/

          cp WhatsAppDateSpoof.plist \
            package/Library/MobileSubstrate/DynamicLibraries/

          cp control package/DEBIAN/control

          dpkg-deb --build \
            package \
            packages/com.coalblox.whatsappdatespoof_1.0.0_iphoneos-arm.deb

      - name: VERIFY DEB EXISTS
        run: |
          echo "Contents of packages:"
          ls -lah packages/

          COUNT=$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l)

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one .deb, found $COUNT"
            exit 1
          fi

          DEB=$(find packages -maxdepth 1 -type f -name '*.deb')

          echo "Found:"
          echo "$DEB"

          echo "Package information:"
          dpkg-deb -I "$DEB"

          echo "Package contents:"
          dpkg-deb -c "$DEB"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppDateSpoof-DEB
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
